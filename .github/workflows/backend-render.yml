name: Backend Render Deploy

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend-render.yml"
    branches:
      - main
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install fastapi pydantic python-dotenv
      - run: python -m compileall app
      - name: Validate portfolio payloads and corpus layout
        working-directory: ${{ github.workspace }}
        run: python scripts/validate_portfolio_project.py

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        run: curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
